<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14171c"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#e8a33d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="50%" stop-color="#2b2f35"/>
      <stop offset="100%" stop-color="#1e2126"/>
    </linearGradient>
    <linearGradient id="steelRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a515a"/>
      <stop offset="100%" stop-color="#23262b"/>
    </linearGradient>
    <linearGradient id="innerLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b658"/>
      <stop offset="100%" stop-color="#c47f28"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="470" cy="315" rx="520" ry="420" fill="url(#glow)"/>

  <!-- subtle grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- ===== VAULT, slightly ajar ===== -->
  <!-- door frame / outer wall opening -->
  <g transform="translate(300,120)">
    <!-- opening behind (light spilling out) -->
    <rect x="0" y="0" width="380" height="390" rx="18" fill="#0d0f12"/>
    <rect x="14" y="12" width="150" height="366" rx="10" fill="url(#innerLight)" opacity="0.9"/>
    <rect x="14" y="12" width="150" height="366" rx="10" fill="url(#innerLight)" opacity="0.5"/>
    <!-- light beam on floor -->
    <polygon points="150,378 300,470 40,470" fill="#e8a33d" opacity="0.10"/>

    <!-- the door itself, swung partly open -->
    <g transform="translate(150,0)">
      <!-- door slab -->
      <rect x="0" y="-6" width="250" height="402" rx="16" fill="url(#steel)" stroke="url(#steelRim)" stroke-width="4"/>
      <!-- bevel edge -->
      <rect x="10" y="6" width="230" height="378" rx="10" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>

      <!-- concentric locking rings -->
      <g transform="translate(128,190)">
        <circle r="118" fill="none" stroke="#4a515a" stroke-width="3" opacity="0.7"/>
        <circle r="92" fill="none" stroke="#3a4048" stroke-width="6" opacity="0.8"/>
        <circle r="64" fill="url(#steelRim)"/>
        <circle r="64" fill="none" stroke="#565d66" stroke-width="2"/>
        <!-- spokes of the wheel -->
        <g stroke="#565d66" stroke-width="7" stroke-linecap="round">
          <line x1="0" y1="-96" x2="0" y2="96"/>
          <line x1="-96" y1="0" x2="96" y2="0"/>
          <line x1="-68" y1="-68" x2="68" y2="68"/>
          <line x1="-68" y1="68" x2="68" y2="-68"/>
        </g>
        <!-- hub -->
        <circle r="26" fill="#2b2f35" stroke="#5f6771" stroke-width="2"/>
        <circle r="8" fill="#e8a33d"/>
        <!-- bolt holes around rim -->
        <g fill="#0d0f12">
          <circle cx="0" cy="-104" r="5"/>
          <circle cx="74" cy="-74" r="5"/>
          <circle cx="104" cy="0" r="5"/>
          <circle cx="74" cy="74" r="5"/>
          <circle cx="0" cy="104" r="5"/>
          <circle cx="-74" cy="74" r="5"/>
          <circle cx="-104" cy="0" r="5"/>
          <circle cx="-74" cy="-74" r="5"/>
        </g>
      </g>

      <!-- hinge side highlight -->
      <rect x="238" y="10" width="6" height="370" rx="3" fill="#5a626c" opacity="0.5"/>
    </g>
  </g>

  <!-- ===== TITLE TEXT ===== -->
  <g transform="translate(730,250)" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" fill="#f4f6f8" font-size="52" font-weight="700" letter-spacing="-0.5">Access,</text>
    <text x="0" y="66" fill="#f4f6f8" font-size="52" font-weight="700" letter-spacing="-0.5">but guarded.</text>
    <line x1="2" y1="102" x2="120" y2="102" stroke="#e8a33d" stroke-width="4"/>
    <text x="0" y="150" fill="#9aa3ad" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">Giving an AI the keys to a database —</text>
    <text x="0" y="182" fill="#9aa3ad" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">and every lock built to contain it.</text>
  </g>
</svg>
