name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # Deliberately not the full requirements.txt: the unit suite must run
      # without streamlit/chromadb/openai, which proves it has no live-service
      # dependency. Keep this list in sync when unit tests gain an import.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pydantic pydantic-settings sqlalchemy \
            plotly pypdf python-docx reportlab pytest \
            fastapi httpx python-multipart email-validator \
            "passlib[bcrypt]" "bcrypt<4.1" PyJWT openpyxl
      - name: Run unit tests
        run: pytest tests/ -q
